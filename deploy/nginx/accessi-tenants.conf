# Accessi multi-tenant dietro Nginx.
#
# Ogni tenant ha un processo sulla propria porta interna. Il proxy instrada per
# host e non espone mai le porte interne. Sostituire i domini e le porte.

map $host $accessi_tenant_upstream {
    accessi.acme.example.com  http://127.0.0.1:3201;
    accessi.beta.example.com  http://127.0.0.1:3202;
    default                   http://127.0.0.1:3201;
}

server {
    listen 443 ssl http2;
    server_name accessi.acme.example.com accessi.beta.example.com;

    ssl_certificate     /etc/letsencrypt/live/accessi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/accessi.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass $accessi_tenant_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}

# Variante path-based: il prefix /acme viene rimosso prima di inoltrare ad
