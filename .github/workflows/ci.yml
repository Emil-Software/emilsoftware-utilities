name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage thresholds)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Firebird 3/5: immagine ufficiale, autenticazione SRP e wire crypt.
          - firebird: "5"
            image: firebirdsql/firebird:5
            database: /var/lib/firebird/data/test_accessi.fdb
            directory: /var/lib/firebird/data
            plugin: ""
            wireCrypt: ""
          - firebird: "3"
            image: firebirdsql/firebird:3
            database: /var/lib/firebird/data/test_accessi.fdb
            directory: /var/lib/firebird/data
            plugin: ""
            wireCrypt: ""
          # Firebird 2.5: immagine jacobalberty (SuperServer), solo Legacy_Auth e senza wire crypt.
          - firebird: "2.5"
            image: jacobalberty/firebird:v2.5.9-ss
            database: /firebird/data/test_accessi.fdb
            directory: /firebird/data
            plugin: Legacy_Auth
            wireCrypt: disabled
    services:
      firebird:
        image: ${{ matrix.image }}
        env:
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_DATABASE_DEFAULT_CHARSET: UTF8
          ISC_PASSWORD: masterkey
        ports:
          - 3050:3050
        options: >-
          --health-cmd "sh -c 'exit 0'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for Firebird
        env:
          ACCESSI_TEST_DB_DATABASE: ${{ matrix.database }}
          ACCESSI_TEST_DB_AUTH_PLUGIN: ${{ matrix.plugin }}
          ACCESSI_TEST_DB_WIRE_CRYPT: ${{ matrix.wireCrypt }}
        run: |
          node -e "
            const F = require('node-firebird');
            const opts = { host: '127.0.0.1', port: 3050, database: process.env.ACCESSI_TEST_DB_DATABASE, user: 'SYSDBA', password: 'masterkey' };
            if (process.env.ACCESSI_TEST_DB_AUTH_PLUGIN) opts.pluginName = process.env.ACCESSI_TEST_DB_AUTH_PLUGIN;
            if (process.env.ACCESSI_TEST_DB_WIRE_CRYPT === 'disabled') opts.wireCrypt = F.WIRE_CRYPT_DISABLE;
            const deadline = Date.now() + 180000;
            let lastError = 'nessun tentativo completato';
            const attempt = () => {
              let settled = false;
              F.attachOrCreate(opts, (err, db) => {
                if (settled) { try { db && db.detach(() => {}); } catch {} return; }
                settled = true;
                if (!err) { db.detach(() => process.exit(0)); return; }
                lastError = err.message;
                if (Date.now() > deadline) { console.error('Firebird non pronto:', lastError); process.exit(1); }
                setTimeout(attempt, 2000);
              });
            };
            attempt();
          "

      - name: Integration tests (Firebird ${{ matrix.firebird }})
        run: |
          node --test --test-concurrency=1 \
            test/integration/accessi.integration.cjs \
            test/integration/allegati.integration.cjs \
            test/accessi-schema.cjs
        env:
          ACCESSI_TEST_REQUIRE_DB: "1"
          ACCESSI_TEST_DB_HOST: 127.0.0.1
          ACCESSI_TEST_DB_PORT: "3050"
          ACCESSI_TEST_DB_DATABASE: ${{ matrix.database }}
          ACCESSI_TEST_DB_DIRECTORY: ${{ matrix.directory }}
          ACCESSI_TEST_DB_USER: SYSDBA
          ACCESSI_TEST_DB_PASSWORD: masterkey
          ACCESSI_TEST_DB_AUTH_PLUGIN: ${{ matrix.plugin }}
          ACCESSI_TEST_DB_WIRE_CRYPT: ${{ matrix.wireCrypt }}
