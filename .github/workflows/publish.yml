name: Publish to npm
on:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    runs-on: ubuntu-latest
    # semantic-release pubblica la GitHub Release e il changelog (contents),
    # commenta issue e PR rilasciate (issues, pull-requests) e pubblica su npm
    # tramite Trusted Publishing con il token OIDC di GitHub Actions (id-token).
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # semantic-release legge tag e cronologia completi.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm CLI supports Trusted Publishing (>= 11.5.1)
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build project
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          # Solo per le API GitHub di semantic-release. La pubblicazione su npm
          # avviene via OIDC (Trusted Publishing): nessun NPM_TOKEN.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
