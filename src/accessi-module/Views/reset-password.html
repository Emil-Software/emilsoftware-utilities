<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #0068ae, #004e80, #002c50);
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 12px;
            backdrop-filter: blur(12px);
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.3);
            width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ffffff;
        }

        .form-group {
            margin: 12px 0;
            text-align: left;
        }

        label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #ffffff;
        }

        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 5px;
            background: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        input:focus {
            outline: none;
            border: 2px solid #ffffff;
            background: rgba(255, 255, 255, 0.2);
        }

        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        button {
            background: linear-gradient(90deg, #0080ff, #0068ae);
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            width: 100%;
            color: #ffffff;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: linear-gradient(90deg, #0095ff, #0070c0);
            transform: scale(1.05);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Reimposta la tua password</h1>
        <form id="resetForm">
            <input type="hidden" id="token" value="">
            <input type="hidden" id="returnUrl" value="">
            <input type="hidden" id="prefix" value="">

            <div class="form-group">
                <label for="password">Nuova Password:</label>
                <input type="password" id="password" required minlength="8" maxlength="100">
                <p class="error" id="passwordError">La password deve avere almeno 8 caratteri con maiuscola, minuscola, cifra e carattere speciale.</p>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Conferma Password:</label>
                <input type="password" id="confirmPassword" required>
                <p class="error" id="confirmError">Le password non corrispondono.</p>
            </div>

            <button type="submit">Aggiorna password</button>
        </form>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            function resolveSafeReturnUrl(rawReturnUrl) {
                if (!rawReturnUrl) {
                    return "/";
                }

                if (rawReturnUrl.startsWith("/")) {
                    return rawReturnUrl;
                }

                try {
                    const parsed = new URL(rawReturnUrl, window.location.origin);
                    if (parsed.origin === window.location.origin) {
                        return `${parsed.pathname}${parsed.search}${parsed.hash}`;
                    }
                } catch (error) {}

                return "/";
            }

            function resolveSafePrefix(rawPrefix) {
                if (!rawPrefix) {
                    return "";
                }

                let normalizedPrefix = rawPrefix.trim();
                if (!normalizedPrefix.startsWith("/")) {
                    normalizedPrefix = "/" + normalizedPrefix;
                }

                if (normalizedPrefix.endsWith("/")) {
                    normalizedPrefix = normalizedPrefix.slice(0, -1);
                }

                return /^\/[A-Za-z0-9/_-]*$/.test(normalizedPrefix) ? normalizedPrefix : "";
            }

            const urlParams = new URLSearchParams(window.location.search);
            const token = window.location.pathname.split("/").pop();
            const returnUrl = resolveSafeReturnUrl(urlParams.get("returnUrl"));
            const prefix = resolveSafePrefix(urlParams.get("prefix"));

            document.getElementById("token").value = token;
            document.getElementById("returnUrl").value = returnUrl;
            document.getElementById("prefix").value = prefix;

            document.getElementById("resetForm").addEventListener("submit", async function (event) {
                event.preventDefault();
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const passwordError = document.getElementById("passwordError");
                const confirmError = document.getElementById("confirmError");

                passwordError.style.display = "none";
                confirmError.style.display = "none";

                // Requisiti allineati alla policy lato backend (passwordPolicy.ts).
                const violations = [];
                if (password.length < 8) violations.push("almeno 8 caratteri");
                if (password.length > 100) violations.push("al massimo 100 caratteri");
                if (/\s/.test(password)) violations.push("nessuno spazio");
                if (!/[A-Z]/.test(password)) violations.push("una lettera maiuscola");
                if (!/[a-z]/.test(password)) violations.push("una lettera minuscola");
                if (!/[0-9]/.test(password)) violations.push("una cifra");
                if (!/[^A-Za-z0-9]/.test(password)) violations.push("un carattere speciale");

                if (violations.length > 0) {
                    passwordError.textContent = "La password non rispetta i requisiti: richiede " + violations.join(", ") + ".";
                    passwordError.style.display = "block";
                    return;
                }

                if (password !== confirmPassword) {
                    confirmError.style.display = "block";
                    return;
                }

                try {
                    const response = await fetch(`${prefix}/api/accessi/auth/confirm-reset-password/${token}`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ newPassword: password })
                    });

                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) {
                        passwordError.textContent = data.message || "La password non rispetta i requisiti di sicurezza.";
                        passwordError.style.display = "block";
                        return;
                    }

                    alert(data.message || "Password aggiornata con successo!");
                    setTimeout(() => {
                        window.location.href = returnUrl;
                    }, 500);
                } catch (error) {
                    alert("Errore nel reset della password. Riprova piu tardi.");
                }
            });
        });
    </script>
</body>

</html>
